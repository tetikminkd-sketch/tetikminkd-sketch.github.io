<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı – Tetik Games</title>
<meta name="description" content="Sayfa bulunamadı.">
<link rel="icon" href="/ikon.png">
<style>
:root{--bg:#141233;--card:#1d1a48;--fg:#eceaf8;--muted:#a9a6cf;--ice:#9fe3ff;--ember:#ff9f43;--rule:#2c2860;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#f6f5fb;--card:#ffffff;--fg:#1b1838;--muted:#5d5a7a;--ice:#2f6fb3;--ember:#c8661a;--rule:#dcdaea;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px}
main{max-width:44rem;margin:0 auto;padding:32px 0 56px}
a{color:var(--ice)}
header.top{display:flex;align-items:center;gap:12px;max-width:44rem;margin:0 auto;padding:16px 0;border-bottom:1px solid var(--rule)}
header.top img{width:40px;height:40px;border-radius:10px}
header.top a{color:var(--fg);text-decoration:none;font-weight:800;letter-spacing:.02em}
h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:0 0 8px;text-wrap:balance}
h2{font-size:1.15rem;margin:30px 0 6px}
p,li{margin:0 0 10px}
ul{padding-left:1.2rem}
.meta{color:var(--muted);font-size:.92rem}
.lang{display:inline-block;margin-top:36px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ice);border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
hr{border:0;border-top:1px solid var(--rule);margin:40px 0 0}
footer{max-width:44rem;margin:0 auto;padding:20px 0 40px;border-top:1px solid var(--rule);color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 18px}
footer a{color:var(--muted)}
.hero{display:grid;gap:18px}
.hero img.banner{width:100%;height:auto;border-radius:14px;display:block}
.btn{display:inline-block;background:var(--ember);color:#141233;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:10px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:0;list-style:none}
.feat li{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:0}
.feat b{display:block;color:var(--ice)}
</style>
</head>
<body>
<header class="top"><img src="/ikon.png" alt=""><a href="/">Tetik Games</a></header>
<main>
<h1>Sayfa bulunamadı</h1>
<p>Aradığın sayfa burada değil. Belki kule onu da yukarı taşıdı.</p>
<p><a class="btn" href="/">Ana sayfaya dön</a></p>

</main>
<footer>
<span>© 2026 Tetik Games</span>
<a href="/">Ana sayfa</a>
<a href="/gizlilik.html">Gizlilik Politikası</a>
<a href="/kosullar.html">Kullanım Koşulları</a>
<a href="mailto:tetik.minkd@gmail.com">tetik.minkd@gmail.com</a>
</footer>
</body>
</html>
